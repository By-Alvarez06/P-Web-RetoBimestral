<h1 style="color: var(--orange-dark); margin-top: 0; text-align: center;">Tiendas</h1>

<div id="mapa-tiendas" class="mapa"></div>
{{ tiendas_json|json_script:"tiendas-json" }}

<div class="table">
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Propietario</th>
                <th>Direccion</th>
                <th>Telefono</th>
                <th>Ver detalles</th>
            </tr>
        </thead>
        <tbody>
        {% for t in tiendas %}
            <tr class="fila" data-href="{% url 'ver_tienda' t.id %}">
                <td>{{ t.nombre }}</td>
                <td>{{ t.propietario }}</td>
                <td>{{ t.direccion }}</td>
                <td>{{ t.telefono }}</td>
                <!-- Agregamos un pequeño ícono de las imágenes estáticas para indicar que se puede hacer clic en la fila -->
                <td>
                    <img src="/static/negocio/imagenes/iso_1.png" alt="Ver detalles" style="width: 30px; height: 30px;">
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="4">No hay tiendas registradas.</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    document.querySelectorAll(".fila").forEach(function (fila) {
        fila.addEventListener("click", function () {
            window.location = fila.dataset.href;
        });
    });

    (function () {
        var tiendas = JSON.parse(document.getElementById("tiendas-json").textContent);

        var mapa = L.map("mapa-tiendas");
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap"
        }).addTo(mapa);

        if (tiendas.length > 0) {
            var marcadores = tiendas.map(function (t) {
                return L.marker([t.lat, t.lng]).addTo(mapa)
                    .bindPopup(t.nombre + "<br><a href='" + t.url + "'>Ver detalle</a>");
            });
            mapa.fitBounds(L.featureGroup(marcadores).getBounds().pad(0.2));
        } else {
            mapa.setView([-3.986659, -79.199088], 13);
        }
    })();
</script>
